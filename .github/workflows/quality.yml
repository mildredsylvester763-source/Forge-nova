name: Backend quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genesis_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-that-is-never-used-for-production
      EXECUTION_WORKER_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d genesis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Apply migrations to a clean PostgreSQL database
        run: npm run db:migrate:deploy
      - name: Check database schema drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee jest-output.log
      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E '^(Tests|Test Suites|Snapshots):' jest-output.log || true
          awk '/^●/{flag=1; count=0} flag{print; count++; if(count>=10) flag=0}' jest-output.log | sed 's/\r//' | grep -v '^[[:space:]]*$' | head -50 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/%/%25/g')
            echo "::error::${safe}"
          done
      - name: Build backend
        run: npm run build
